# Pre-commit hooks — run automatically before every local git commit.
# Install once with: pip install pre-commit && pre-commit install
#
# Why pre-commit hooks?
# They are the FIRST gate in the security pipeline — catching issues
# before code ever reaches GitHub. This is "shift left" security in action.
#
# Gates in this file:
#   1. General hygiene  — trailing whitespace, file endings, YAML/JSON validity
#   2. Secret detection — hard-coded private keys and credentials
#   3. SAST (local)     — Bandit Python security scan before commit

repos:
  # ── Gate 1: General code hygiene ────────────────────────────────────────────
  # These hooks are maintained by the pre-commit project itself.
  # They catch formatting issues and structural problems before they hit CI.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # Removes invisible trailing spaces
      - id: end-of-file-fixer         # Ensures files end with a newline
      - id: check-yaml                # Validates YAML syntax (catches broken configs)
      - id: check-json                # Validates JSON syntax
      - id: check-merge-conflict      # Blocks committing unresolved merge markers
      - id: detect-private-key        # Catches SSH private keys, PEM files, etc.

  # ── Gate 2: SAST — Static Application Security Testing ──────────────────────
  # Bandit scans Python source code for security vulnerabilities without running it.
  # Common findings: SQL injection patterns, hardcoded passwords, insecure functions.
  # We run this locally so developers get instant feedback before pushing.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Bandit SAST scan (backend)
        args:
          - --severity-level
          - medium          # Block commit on MEDIUM or HIGH severity findings
          - --exit-zero     # Still show findings but don't hard-block on low issues
                            # Remove --exit-zero to enforce strict local blocking
        files: ^backend/    # Only scan the Python backend directory
